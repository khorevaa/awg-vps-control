name: Release manager and images

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: awg-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$TAG" == "v$(cat version)" ]]
          printf 'version=%s\n' "${TAG#v}" >> "$GITHUB_OUTPUT"
  images:
    needs: identity
    uses: ./.github/workflows/publish_ui_images.yml
    with:
      version: ${{ needs.identity.outputs.version }}
    permissions:
      contents: read
      actions: read
      packages: write
  release:
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish checked release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name awg_vps_control_linux_amd64 --dir dist
          (cd dist && sha256sum --check awg_vps_control_linux_amd64.tar.gz.sha256)
          release_options=()
          if [[ "$TAG" == *-* ]]; then release_options+=(--prerelease); fi
          notes_file="docs/releases/${TAG//[.-]/_}.md"
          if [[ -f "$notes_file" ]]; then
            release_options+=(--notes-file "$notes_file")
          else
            release_options+=(--generate-notes)
          fi
          gh release create "$TAG" --verify-tag --title "awg-vps-control $TAG" "${release_options[@]}" dist/awg_vps_control_linux_amd64.tar.gz dist/awg_vps_control_linux_amd64.tar.gz.sha256
