name: Desktop Windows

on:
  push:
    branches: [develop, main, 'codex/**']
    paths: ['desktop/**', 'scripts/build_desktop.ps1', '.github/workflows/desktop_windows.yml', '.gitattributes', 'version']
  pull_request:
    paths: ['desktop/**', 'scripts/build_desktop.ps1', '.github/workflows/desktop_windows.yml', '.gitattributes', 'version']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache: false
      - name: Verify module and source
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Recurse -Filter '*.go' | ForEach-Object FullName
          if (gofmt -l $files) { throw 'Go formatting differs' }
          go mod tidy
          if ($LASTEXITCODE -ne 0) { throw 'go mod tidy failed' }
          git diff --exit-code -- go.mod go.sum
          if ($LASTEXITCODE -ne 0) { throw 'Module files differ' }
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'Module verification failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'go vet failed' }
          go test -race ./...
          if ($LASTEXITCODE -ne 0) { throw 'go test failed' }
      - name: Lint and check dependencies
        working-directory: desktop
        shell: pwsh
        run: |
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run
          if ($LASTEXITCODE -ne 0) { throw 'golangci-lint failed' }
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          if ($LASTEXITCODE -ne 0) { throw 'govulncheck failed' }
      - name: Build portable application
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Tracked sources changed during verification' }
          $changes = git status --porcelain=v1 --untracked-files=all
          if ($changes) { throw "Working copy changed: $changes" }
          ./scripts/build_desktop.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: awg_vps_desktop_windows_amd64
          path: |
            dist/desktop/awg_vps_desktop_windows_amd64.zip
            dist/desktop/awg_vps_desktop_windows_amd64.zip.sha256
          if-no-files-found: error
          retention-days: 14
